name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Android SDK packages (NDK 28.2 + CMake 3.22.1)
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Build debug APK
        run: |
          chmod +x gradlew || true
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8/' gradle.properties
          ./gradlew :mobile:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK=mobile/build/outputs/apk/debug/mobile-debug.apk
          ls -lh "$APK"
          sha256sum "$APK"
          unzip -l "$APK" | grep -E 'assets/web/app\.js|lib/arm64-v8a/libwheelplay-rtc\.so' || true

      - name: Publish rolling release (ci-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=mobile/build/outputs/apk/debug/mobile-debug.apk
          printf '%s\n' \
            "WheelPlay 源码构建（debug），未包含 CarPlay 认证资源。" \
            "首次使用需在 App「设置 - CarPlay 认证资源」导入；可从 DiPlay APK 导入。" \
            "Run #${{ github.run_number }} · commit ${{ github.sha }}" > /tmp/notes.md
          gh release view ci-latest >/dev/null 2>&1 || \
            gh release create ci-latest --title "WheelPlay CI build (rolling)" --notes-file /tmp/notes.md
          gh release upload ci-latest "$APK" --clobber
          gh release edit ci-latest --notes-file /tmp/notes.md
